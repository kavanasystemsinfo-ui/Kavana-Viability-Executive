id: kavana-apartaments
name: "Kavana Apartaments"
legal_name: "Kavana Apartaments S.L."
tagline: "Promoviendo hogares, construyendo futuro en el Mediterráneo"
description: |
  Kavana Apartaments es una promotora inmobiliaria residencial con sede en Castellón de la Plana, 
  especializada en desarrollos de vivienda nueva en la costa mediterránea (Castellón, Valencia, 
  Alicante y Baleares). Fundada en 2019, combina rigor financiero, excelencia constructiva y 
  atención al cliente para entregar hogares de calidad en plazos comprometidos.

mission: |
  Desarrollar promociones inmobiliarias residenciales de alta calidad en el arco mediterráneo,
  garantizando rentabilidad sostenida para los socios, seguridad jurídica para los compradores
  y excelencia constructiva en cada vivienda entregada.

vision: |
  Ser la promotora de referencia en la Comunidad Valenciana y Baleares para 2028, reconocida
  por su transparencia, cumplimiento de plazos y calidad de producto, con una cartera de 15+
  promociones activas y 500+ viviendas entregadas al año.

values:
  - "Rigor financiero: cada decisión pasa por el filtro de viabilidad económica"
  - "Transparencia total: información clara a socios, bancos y compradores"
  - "Compromiso de plazo: la fecha de entrega es una promesa, no una estimación"
  - "Calidad constructiva: materiales y acabados que perduran"
  - "Cercanía mediterránea: trato directo, accesible y humano"

