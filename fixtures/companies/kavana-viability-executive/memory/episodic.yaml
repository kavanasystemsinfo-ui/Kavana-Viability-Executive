    type: "decision"
    title: "Ejercicio opción compra suelo Cala Serena (Mallorca)"
    participants: ["jorge-adan", "andres-vidal", "carlos-martinez", "elena-ruiz"]
    summary: |
      Ejercida opción compra suelo Cala Serena (9,5M€) tras due diligence favorable (85% completada). 
