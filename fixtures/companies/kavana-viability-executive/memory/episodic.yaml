    title: "Compra suelo Mar Azul (Valencia)"
    participants: ["jorge-adan", "andres-vidal", "carlos-martinez", "elena-ruiz"]
    summary: |
      Compra suelo Mar Azul: 7,2M€ (12.500 m², edificabilidad 6.800 m²t). 
