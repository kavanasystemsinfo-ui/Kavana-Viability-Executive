episodic_memory:
  - id: mem-2025-09-15-pricing-decision
    date: "2025-09-15"
    type: "decision"
    title: "Decisión pricing remanente La Marina + lanzamiento Los Naranjos"
    participants: ["jorge-adan", "andres-vidal", "laura-garcia", "elena-ruiz"]
    scenario_ref: "mediterranea_001"
    decision: "opcion_c"
    summary: |
      Aprobada opción C: campaña "Todo incluido" (gastos + muebles cocina + plaza garaje) 
      sin bajar precio catálogo. Coste 748k€ asumible. Target: 4 reservas/semana. 
      Revisión a 4 semanas (13 oct). Si no tracción → activar opción B solo 4 uds La Marina.
    rationale: "Protege ancla precios Los Naranjos, diferencia vs competencia, evita riesgo jurídico."
    outcome: "Pendiente ejecución (inicio campaña 22 sep)"
    tags: ["pricing", "comercial", "decision-ejecutiva"]

  - id: mem-2025-09-10-financiacion-pipeline
    date: "2025-09-10"
    type: "decision"
    title: "Estructuración financiación pipeline 2026 (45M€)"
    participants: ["jorge-adan", "andres-vidal", "carlos-martinez"]
    scenario_ref: "mediterranea_002"
    decision: "opcion_b"
    summary: |
      Aprobada opción B: Senior banco 50% + Mezzanine fondo privado 25% + Equity 25%. 
      Cierra Mar Azul y Cala Serena sin pre-ventas 30%. Coste blendado ~6%. 
      Libera 5,3M€ caja para opciones suelo 2026.
    rationale: "Velocidad y certidumbre para Mar Azul/Cala Serena > coste extra 500k€/año vs opción A."
    outcome: "Mandato a Andrés: cerrar con 2 fondos + 2 bancos antes 31 oct. Negociar covenants flexibles."
    tags: ["financiacion", "deuda", "pipeline-2026", "decision-ejecutiva"]

  - id: mem-2025-09-20-licencia-los-naranjos
    date: "2025-09-20"
    type: "decision"
    title: "Estrategia licencia Los Naranjos: recurso + modificación paralela"
    participants: ["jorge-adan", "carlos-martinez", "elena-ruiz", "pablo-ortiz"]
    scenario_ref: "mediterranea_003"
    decision: "opcion_c"
    summary: |
      Recurso contencioso + modificación proyecto PB+4 en paralelo. Coste 100k€. 
      Si cautelar favorable (30%) → 84 uds. Si denegada (70%) → licencia 68 uds en 2 sem.
      Lanzamiento comercial 68 uds preparado para activar inmediato.
    rationale: "Real option value: 350k€ upside esperado vs opción B. Señal equilibrada."
    outcome: "Esta semana: presentar recurso (Carlos) + modificar proyecto (Pablo, 2 sem)."
    tags: ["licencias", "urbanismo", "time-to-market", "decision-ejecutiva"]

