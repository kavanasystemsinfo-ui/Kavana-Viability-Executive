    participants: ["jorge-adan", "andres-vidal", "elena-ruiz", "carlos-martinez", "laura-garcia", "pablo-ortiz", "maria-lopez"]
    summary: |
      Aprobadas cuentas Q2 2025: Revenue 9,8M€, EBITDA 2,1M€, Caja 4,7M€. 
      Ratificada estrategia 3 lanzamientos 2026. Aprobada línea crédito revolving 5M€ (CaixaBank) 
