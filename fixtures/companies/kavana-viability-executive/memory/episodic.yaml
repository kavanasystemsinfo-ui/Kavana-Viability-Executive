  - id: mem-2024-09-01-certificacion-energetica
    date: "2024-09-01"
    type: "policy"
    title: "Política certificación energética A/B obligatoria nuevas promociones"
    participants: ["pablo-ortiz", "jorge-adan", "andres-vidal", "elena-ruiz"]
    summary: |
      Aprobada política: todas las promociones nuevas (licencia post-2024) target certificación 
      energética A o B (DB-HE). Implicaciones: aislamiento reforzado, aerotermia, fotovoltaica 
      autoconsumo, carpintería alta prestación. Sobrecoste estimado 3-4% presupuesto construcción, 
      compensado por: acceso financiación verde (spread -0,15%), precio venta +2-3%, 
      diferenciación comercial. Requisito para mezzanine ICO/NextGen (mediterranea_002 opción C).
    tags: ["sostenibilidad", "certificacion", "politica", "producto"]

