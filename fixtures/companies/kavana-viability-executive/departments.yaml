    description: "Admin general, RRHH, IT, proveedores corporativos, contabilidad analítica, oficina"
    headcount: 4
    budget_eur_year: 320000
    sub_areas:
      - name: "Administración y Contabilidad Analítica"
        headcount: 2
        responsibilities:
