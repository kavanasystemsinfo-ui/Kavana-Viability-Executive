    key_processes:
      - "Definición producto (fase proyecto básico)"
      - "Aprobación equivalencias materiales"
      - "Auditorías calidad obra (quincenales)"
      - "Certificación final energética"
    kpis:
      - "Calificación energética media (A-G)"
      - "Incidencias calidad / 100 uds entregadas"
      - "% viviendas con calificación A/B"
      - "Coste extras no presupuestados / promo"

  - id: administracion-rrhh
    name: "Administración y RRHH"
